<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos — Salón</title>
<meta name="description" content="Reservá tu turno online. Elegí servicio, día y horario.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,400;6..96,1,400;6..96,0,600&family=Karla:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#221A28; --porcelana:#EAE4EC; --papel:#FFF; --violeta:#6C3A7C;
    --violeta-d:#522C5E; --blush:#E4A9C0; --gris:#9A93A0; --regla:#D6CCD9;
    --ok:#3F7D5C; --error:#A33B4E;
    --display:"Bodoni Moda",Georgia,serif;
    --texto:"Karla","Helvetica Neue",Arial,sans-serif;
    --mono:"DM Mono","SF Mono",Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--texto); color:var(--ink); background:var(--porcelana);
    line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:64px;
  }
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--violeta); outline-offset:3px}

  .envoltorio{max-width:680px;margin:0 auto;padding:0 20px}

  .barra{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 18px}
  .marca{font-family:var(--display);font-size:20px;letter-spacing:.02em}
  .btn-panel{
    background:none;border:1px solid var(--regla);border-radius:2px;padding:7px 14px;
    font-size:12px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
    transition:border-color .18s,background .18s;
  }
  .btn-panel:hover{border-color:var(--violeta);background:rgba(108,58,124,.06)}

  .hero{padding:26px 0 34px;border-top:1px solid var(--regla)}
  .rubro{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--violeta);margin:0 0 14px}
  .hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,9vw,62px);line-height:.98;letter-spacing:-.015em;margin:0 0 16px}
  .hero h1 em{font-style:italic;color:var(--violeta)}
  .hero p{margin:0;max-width:46ch;color:#5B5262;font-size:15px}

  .paso{padding:28px 0;border-top:1px solid var(--regla)}
  .paso[hidden]{display:none}
  .paso-cab{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .paso-n{font-family:var(--mono);font-size:11px;color:var(--gris);letter-spacing:.1em;padding-top:2px}
  .paso h2{font-family:var(--texto);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:0}

  .servicios{display:grid;gap:8px}
  .serv{
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 16px;
    background:var(--papel);border:1px solid transparent;border-radius:3px;
    padding:14px 16px;cursor:pointer;text-align:left;width:100%;transition:border-color .18s;
  }
  .serv:hover{border-color:var(--blush)}
  .serv[aria-pressed="true"]{border-color:var(--violeta);background:#F7F2F8}
  .serv-nom{font-weight:500;font-size:15px}
  .serv-meta{font-family:var(--mono);font-size:12px;color:var(--gris)}
  .serv-precio{font-family:var(--mono);font-size:13px;white-space:nowrap}

  .dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .dia{
    flex:0 0 auto;width:60px;padding:10px 0;border-radius:3px;cursor:pointer;
    background:var(--papel);border:1px solid transparent;text-align:center;transition:border-color .18s;
  }
  .dia:hover:not(:disabled){border-color:var(--blush)}
  .dia[aria-pressed="true"]{background:var(--violeta);border-color:var(--violeta);color:#fff}
  .dia:disabled{opacity:.35;cursor:not-allowed}
  .dia-sem{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block}
  .dia-num{font-family:var(--display);font-size:21px;display:block;line-height:1.25}
  .dia-mes{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;display:block;opacity:.65}

  .agenda{background:var(--papel);border-radius:3px;padding:6px 0}
  .fila{
    position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:14px;width:100%;background:none;border:0;padding:13px 18px;cursor:pointer;
    text-align:left;transition:background .16s;
  }
  .fila .hora{font-family:var(--mono);font-size:14px}
  .fila .regla{height:1px;background:var(--regla)}
  .fila .estado{font-family:var(--mono);font-size:11px;color:var(--gris);letter-spacing:.04em}
  .fila:hover:not(:disabled){background:#F7F2F8}
  .fila:hover:not(:disabled) .regla{background:var(--blush)}
  .fila[aria-pressed="true"]{background:var(--violeta);color:#fff}
  .fila[aria-pressed="true"] .regla{background:rgba(255,255,255,.4)}
  .fila[aria-pressed="true"] .estado{color:rgba(255,255,255,.85)}
  .fila:disabled{cursor:not-allowed}
  .fila:disabled .hora,.fila:disabled .estado{color:var(--gris)}
  .tachado{position:absolute;left:18px;right:18px;top:50%;height:1.5px;background:var(--gris);transform-origin:left}
  .tachado.recien{animation:tachar .5s cubic-bezier(.6,0,.3,1)}
  @keyframes tachar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .vacio{padding:26px 18px;font-size:14px;color:#5B5262;background:var(--papel);border-radius:3px}

  .campos{display:grid;gap:12px}
  .campo{display:grid;gap:6px}
  .campo label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5B5262}
  .campo input{background:var(--papel);border:1px solid var(--regla);border-radius:3px;padding:12px 14px;font-size:15px;width:100%}
  .campo input:focus{border-color:var(--violeta)}
  .resumen{background:var(--papel);border-left:3px solid var(--violeta);padding:14px 16px;border-radius:0 3px 3px 0;margin-bottom:16px}
  .resumen span{font-family:var(--mono);font-size:13px;color:#5B5262;display:block;margin-top:3px}

  .btn{background:var(--violeta);color:#fff;border:0;border-radius:3px;padding:15px 22px;font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;width:100%;transition:background .18s}
  .btn:hover:not(:disabled){background:var(--violeta-d)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sec{background:none;border:1px solid var(--regla);border-radius:3px;padding:11px 18px;font-size:13px;cursor:pointer;transition:border-color .18s}
  .btn-sec:hover{border-color:var(--violeta)}

  .aviso{font-size:13px;padding:11px 14px;border-radius:3px;margin-top:12px}
  .aviso.mal{background:#FBEEF0;color:var(--error)}
  .banner{background:#FBEEF0;color:var(--error);font-size:13px;padding:11px 16px;border-radius:3px;margin-bottom:14px;line-height:1.55}

  .listo{padding:44px 0;text-align:center}
  .listo h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 10px}
  .listo h2 em{font-style:italic;color:var(--violeta)}
  .listo .detalle{font-family:var(--mono);font-size:14px;color:#5B5262;margin:0 0 26px;line-height:1.9;white-space:pre-line}
  .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .enlace-cal{display:inline-block;text-decoration:none;background:var(--ink);color:#fff;border-radius:3px;padding:11px 18px;font-size:13px}
  .enlace-cal:hover{background:#3A2D42}

  .panel-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 0 18px;border-top:1px solid var(--regla)}
  .panel-cab h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
  .turno{background:var(--papel);border-radius:3px;padding:15px 17px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
  .turno .t-hora{font-family:var(--mono);font-size:15px;color:var(--violeta);font-weight:500}
  .turno .t-nom{font-weight:600;font-size:15px}
  .turno .t-meta{font-family:var(--mono);font-size:12px;color:#5B5262}
  .turno .t-acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .mini{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-decoration:none;border:1px solid var(--regla);border-radius:2px;padding:6px 10px;background:none;cursor:pointer;color:var(--ink);transition:border-color .18s}
  .mini:hover{border-color:var(--violeta)}
  .mini.borrar:hover{border-color:var(--error);color:var(--error)}
  .conf-bloque{background:var(--papel);border-radius:3px;padding:18px;margin-bottom:12px}
  .conf-bloque h3{font-family:var(--texto);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 14px;color:#5B5262}
  .nota{font-size:12px;color:#5B5262;margin-top:14px;line-height:1.6}

  @media (max-width:520px){ .serv{grid-template-columns:1fr} .serv-precio{justify-self:start} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="envoltorio">
  <div class="barra">
    <div class="marca" id="marca">Salón</div>
    <button class="btn-panel" id="ir-panel">Panel</button>
  </div>

  <div id="vista-clienta">
    <div id="banner"></div>

    <section class="hero">
      <p class="rubro">Turnos online</p>
      <h1>Elegí tu <em>horario</em></h1>
      <p>Lo que ves libre está libre de verdad. Cuando confirmás, ese horario queda tomado y desaparece para el resto.</p>
    </section>

    <section class="paso">
      <div class="paso-cab"><span class="paso-n">01</span><h2>Servicio</h2></div>
      <div class="servicios" id="servicios"></div>
    </section>

    <section class="paso" id="paso-dia" hidden>
      <div class="paso-cab"><span class="paso-n">02</span><h2>Día</h2></div>
      <div class="dias" id="dias"></div>
    </section>

    <section class="paso" id="paso-hora" hidden>
      <div class="paso-cab"><span class="paso-n">03</span><h2>Horario</h2></div>
      <div id="agenda"></div>
    </section>

    <section class="paso" id="paso-datos" hidden>
      <div class="paso-cab"><span class="paso-n">04</span><h2>Tus datos</h2></div>
      <div class="resumen" id="resumen"></div>
      <div class="campos">
        <div class="campo"><label for="nombre">Nombre y apellido</label><input id="nombre" type="text" autocomplete="name" placeholder="Ana Pérez"></div>
        <div class="campo"><label for="tel">WhatsApp</label><input id="tel" type="tel" autocomplete="tel" placeholder="11 5555 5555"></div>
      </div>
      <div id="aviso-reserva"></div>
      <div style="margin-top:16px"><button class="btn" id="confirmar">Reservar turno</button></div>
    </section>

    <section class="listo" id="listo" hidden></section>
  </div>

  <div id="vista-panel" hidden>
    <div class="panel-cab">
      <h2>Panel</h2>
      <button class="btn-panel" id="salir-panel">Volver</button>
    </div>
    <div id="panel-cuerpo"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════════
   1. EDITÁ ESTO — es lo único que tenés que tocar
   ══════════════════════════════════════════════════════════════════ */

// Pegá acá la URL de tu Google Apps Script (mirá backend.gs).
// Mientras esté vacío, la página anda en modo demo: no guarda nada.
var API = "https://script.google.com/macros/s/AKfycbwM8jLNaYNGR59f5R_sc1liuepQ1EtD8d25ujip4no4jyjCTyQibp5ZaGm13abcawNw/exec";

var CONFIG = {
  salon: "Salón",
  pin: "1234",          // para entrar al panel
  paso: 30,             // cada cuántos minutos puede arrancar un turno

  servicios: [
    { id:"s1", nombre:"Corte y brushing",          dur:60,  precio:"$18.000" },
    { id:"s2", nombre:"Brushing",                  dur:45,  precio:"$12.000" },
    { id:"s3", nombre:"Color / retoque de raíz",   dur:120, precio:"$45.000" },
    { id:"s4", nombre:"Mechas / balayage",         dur:180, precio:"$75.000" },
    { id:"s5", nombre:"Tratamiento capilar",       dur:90,  precio:"$38.000" }
  ],

  // 0 = domingo … 6 = sábado.  null = cerrado
  horario: {
    "0": null,
    "1": null,
    "2": ["09:00","19:00"],
    "3": ["09:00","19:00"],
    "4": ["09:00","19:00"],
    "5": ["09:00","19:00"],
    "6": ["09:00","16:00"]
  }
};

/* ══════════════════════════════════════════════════════════════════
   2. De acá para abajo no hace falta tocar nada
   ══════════════════════════════════════════════════════════════════ */

var SEM  = ["dom","lun","mar","mié","jue","vie","sáb"];
var SEML = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MES  = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

var demo = {};   // memoria temporal cuando no hay API
var $ = function(id){ return document.getElementById(id); };

/* ---------- datos ---------- */
async function llamar(params){
  var u = API + (API.indexOf("?") > -1 ? "&" : "?") + new URLSearchParams(params).toString();
  var r = await fetch(u);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

async function traerTurnos(fecha){
  if(!API) return demo[fecha] || [];
  try{
    var j = await llamar({ accion:"turnos", fecha:fecha });
    return j.turnos || [];
  }catch(e){ return []; }
}

async function traerProximos(){
  if(!API){
    var todos = [];
    Object.keys(demo).forEach(function(f){ todos = todos.concat(demo[f]); });
    return todos;
  }
  try{
    var j = await llamar({ accion:"proximos" });
    return j.turnos || [];
  }catch(e){ return []; }
}

async function pedirReserva(t){
  if(!API){
    var lista = demo[t.fecha] || [];
    if(seSuperpone(lista, aMin(t.hora), aMin(t.hora) + t.dur)) return { ok:false, error:"ocupado" };
    t.id = "demo" + Date.now();
    lista.push(t);
    lista.sort(function(a,b){ return aMin(a.hora) - aMin(b.hora); });
    demo[t.fecha] = lista;
    return { ok:true, turno:t };
  }
  return await llamar({
    accion:"reservar", fecha:t.fecha, hora:t.hora, dur:t.dur,
    servicio:t.servicio, precio:t.precio, nombre:t.nombre, tel:t.tel
  });
}

async function pedirCancelar(id, fecha){
  if(!API){
    demo[fecha] = (demo[fecha] || []).filter(function(x){ return x.id !== id; });
    return { ok:true };
  }
  return await llamar({ accion:"cancelar", id:id });
}

/* ---------- tiempo ---------- */
function isoFecha(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function aMin(h){ var p = String(h).split(":"); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }
function aHora(m){ return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
function fechaDesdeIso(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function dur(m){ if(m < 60) return m + " min"; var h = Math.floor(m/60), r = m%60; return h + " h" + (r ? " " + r : ""); }
function seSuperpone(lista, ini, fin){
  return lista.some(function(r){ var a = aMin(r.hora), b = a + Number(r.dur); return ini < b && a < fin; });
}

/* ---------- estado ---------- */
var sel = { servicio:null, fecha:null, hora:null };
var reservasDia = [];
var recien = null;
var panelAbierto = false;
var panelFecha = isoFecha(new Date());

/* ---------- servicios ---------- */
function pintarServicios(){
  var c = $("servicios");
  c.innerHTML = "";
  CONFIG.servicios.forEach(function(s){
    var b = document.createElement("button");
    b.className = "serv"; b.type = "button";
    b.setAttribute("aria-pressed", sel.servicio && sel.servicio.id === s.id ? "true" : "false");
    b.innerHTML = '<span><span class="serv-nom"></span><br><span class="serv-meta"></span></span><span class="serv-precio"></span>';
    b.querySelector(".serv-nom").textContent = s.nombre;
    b.querySelector(".serv-meta").textContent = dur(s.dur);
    b.querySelector(".serv-precio").textContent = s.precio || "";
    b.addEventListener("click", function(){
      sel.servicio = s; sel.hora = null;
      pintarServicios();
      $("paso-dia").hidden = false;
      pintarDias();
      if(sel.fecha) cargarDia();
      else { $("paso-hora").hidden = true; $("paso-datos").hidden = true; }
      $("paso-dia").scrollIntoView({ behavior:"smooth", block:"start" });
    });
    c.appendChild(b);
  });
}

/* ---------- días ---------- */
function tiraDias(contenedor, activa, alElegir){
  contenedor.innerHTML = "";
  var hoy = new Date();
  for(var i=0;i<21;i++){
    var d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()+i);
    var iso = isoFecha(d);
    var abierto = !!CONFIG.horario[String(d.getDay())];
    var b = document.createElement("button");
    b.className = "dia"; b.type = "button";
    b.disabled = !abierto && alElegir === elegirDiaClienta;
    b.setAttribute("aria-pressed", activa === iso ? "true" : "false");
    b.innerHTML = '<span class="dia-sem"></span><span class="dia-num"></span><span class="dia-mes"></span>';
    b.querySelector(".dia-sem").textContent = i === 0 ? "hoy" : SEM[d.getDay()];
    b.querySelector(".dia-num").textContent = d.getDate();
    b.querySelector(".dia-mes").textContent = MES[d.getMonth()];
    (function(iso){ b.addEventListener("click", function(){ alElegir(iso); }); })(iso);
    contenedor.appendChild(b);
  }
}
function elegirDiaClienta(iso){
  sel.fecha = iso; sel.hora = null; recien = null;
  pintarDias(); cargarDia();
}
function pintarDias(){ tiraDias($("dias"), sel.fecha, elegirDiaClienta); }

/* ---------- agenda ---------- */
async function cargarDia(){
  $("paso-hora").hidden = false;
  $("agenda").innerHTML = '<div class="vacio">Buscando horarios…</div>';
  reservasDia = await traerTurnos(sel.fecha);
  pintarAgenda();
}

function pintarAgenda(){
  var cont = $("agenda"); cont.innerHTML = "";
  var d = fechaDesdeIso(sel.fecha);
  var franja = CONFIG.horario[String(d.getDay())];
  if(!franja){ cont.innerHTML = '<div class="vacio">Ese día no hay atención. Elegí otro del listado.</div>'; return; }

  var abre = aMin(franja[0]), cierra = aMin(franja[1]);
  var ahora = new Date();
  var esHoy = sel.fecha === isoFecha(ahora);
  var minAhora = ahora.getHours()*60 + ahora.getMinutes();

  var slots = [];
  for(var t = abre; t + sel.servicio.dur <= cierra; t += CONFIG.paso){
    var fin = t + sel.servicio.dur;
    var pasado = esHoy && t <= minAhora + 30;
    slots.push({ ini:t, fin:fin, hora:aHora(t), pasado:pasado, libre: !seSuperpone(reservasDia, t, fin) && !pasado });
  }

  if(!slots.some(function(s){ return s.libre; })){
    cont.innerHTML = '<div class="vacio">No queda lugar para ese servicio este día. Probá con otro.</div>';
    return;
  }

  var caja = document.createElement("div");
  caja.className = "agenda";
  slots.forEach(function(s){
    var b = document.createElement("button");
    b.className = "fila"; b.type = "button"; b.disabled = !s.libre;
    b.setAttribute("aria-pressed", sel.hora === s.hora ? "true" : "false");
    b.innerHTML = '<span class="hora"></span><span class="regla"></span><span class="estado"></span>';
    b.querySelector(".hora").textContent = s.hora;
    b.querySelector(".estado").textContent = s.libre ? "hasta " + aHora(s.fin) : (s.pasado ? "ya pasó" : "reservado");
    if(!s.libre){
      var x = document.createElement("span");
      x.className = "tachado" + (recien === s.hora ? " recien" : "");
      b.appendChild(x);
    }
    b.addEventListener("click", function(){ sel.hora = s.hora; pintarAgenda(); mostrarFormulario(); });
    caja.appendChild(b);
  });
  cont.appendChild(caja);
}

/* ---------- formulario ---------- */
function mostrarFormulario(){
  $("paso-datos").hidden = false;
  var d = fechaDesdeIso(sel.fecha);
  $("resumen").innerHTML = "<strong></strong><span></span>";
  $("resumen").querySelector("strong").textContent = sel.servicio.nombre;
  $("resumen").querySelector("span").textContent =
    SEML[d.getDay()] + " " + d.getDate() + " de " + MES[d.getMonth()] + " · " + sel.hora +
    " · " + dur(sel.servicio.dur) + (sel.servicio.precio ? " · " + sel.servicio.precio : "");
  $("aviso-reserva").innerHTML = "";
  $("paso-datos").scrollIntoView({ behavior:"smooth", block:"start" });
}
function aviso(txt){
  $("aviso-reserva").innerHTML = '<div class="aviso mal"></div>';
  $("aviso-reserva").firstChild.textContent = txt;
}

async function confirmar(){
  var nombre = $("nombre").value.trim(), tel = $("tel").value.trim();
  if(nombre.length < 3){ aviso("Escribí tu nombre y apellido para poder identificar el turno."); return; }
  if(tel.replace(/\D/g,"").length < 8){ aviso("Falta un WhatsApp válido para confirmarte el turno."); return; }

  var btn = $("confirmar");
  btn.disabled = true; btn.textContent = "Reservando…";

  var t = {
    fecha: sel.fecha, hora: sel.hora, dur: sel.servicio.dur,
    servicio: sel.servicio.nombre, precio: sel.servicio.precio || "",
    nombre: nombre, tel: tel
  };

  var res;
  try{ res = await pedirReserva(t); }
  catch(e){ res = { ok:false, error:"red" }; }

  btn.disabled = false; btn.textContent = "Reservar turno";

  if(res && res.ok){
    recien = t.hora;
    mostrarListo(res.turno || t);
    return;
  }
  if(res && res.error === "ocupado"){
    reservasDia = await traerTurnos(sel.fecha);
    sel.hora = null;
    $("paso-datos").hidden = true;
    pintarAgenda();
    $("paso-hora").scrollIntoView({ behavior:"smooth", block:"start" });
    return;
  }
  aviso("No se pudo guardar el turno. Revisá tu conexión y probá de nuevo.");
}

/* ---------- confirmación ---------- */
function enlaceGoogle(t){
  var ini = t.fecha.replace(/-/g,"") + "T" + t.hora.replace(":","") + "00";
  var f = fechaDesdeIso(t.fecha);
  f.setMinutes(aMin(t.hora) + Number(t.dur));
  var fin = isoFecha(f).replace(/-/g,"") + "T" + String(f.getHours()).padStart(2,"0") + String(f.getMinutes()).padStart(2,"0") + "00";
  var p = new URLSearchParams({
    action:"TEMPLATE",
    text: t.servicio + " — " + t.nombre,
    dates: ini + "/" + fin,
    details: "Turno reservado desde la web.\nWhatsApp: " + t.tel,
    location: CONFIG.salon
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function mostrarListo(t){
  document.querySelectorAll(".hero,.paso").forEach(function(el){ el.hidden = true; });
  var d = fechaDesdeIso(t.fecha), box = $("listo");
  box.hidden = false;
  box.innerHTML =
    '<h2>Turno <em>reservado</em></h2><p class="detalle"></p>' +
    '<div class="acciones"><a class="enlace-cal" target="_blank" rel="noopener">Agregar a mi calendario</a>' +
    '<button class="btn-sec" id="otro">Sacar otro turno</button></div>';
  box.querySelector(".detalle").textContent =
    t.servicio + "\n" + SEML[d.getDay()] + " " + d.getDate() + " de " + MES[d.getMonth()] + " a las " + t.hora + "\n" + t.nombre;
  box.querySelector(".enlace-cal").href = enlaceGoogle(t);
  box.querySelector("#otro").addEventListener("click", function(){
    sel = { servicio:null, fecha:null, hora:null };
    $("nombre").value = ""; $("tel").value = "";
    box.hidden = true;
    document.querySelectorAll(".hero,.paso").forEach(function(el){ el.hidden = false; });
    $("paso-dia").hidden = true; $("paso-hora").hidden = true; $("paso-datos").hidden = true;
    pintarServicios();
    window.scrollTo({ top:0, behavior:"smooth" });
  });
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------- panel ---------- */
function pedirPin(){
  $("panel-cuerpo").innerHTML =
    '<div class="conf-bloque"><h3>Acceso</h3>' +
    '<div class="campo"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric"></div>' +
    '<div id="aviso-pin"></div>' +
    '<div style="margin-top:14px"><button class="btn" id="entrar">Entrar</button></div>' +
    '<p class="nota">El PIN está escrito en el código de la página: evita que una clienta entre por curiosidad, pero no es una contraseña segura.</p></div>';
  $("entrar").addEventListener("click", function(){
    if($("pin").value === String(CONFIG.pin)){ panelAbierto = true; pintarPanel(); }
    else $("aviso-pin").innerHTML = '<div class="aviso mal">PIN incorrecto.</div>';
  });
  $("pin").addEventListener("keydown", function(e){ if(e.key === "Enter") $("entrar").click(); });
}

function tarjeta(t, conFecha){
  var d = fechaDesdeIso(t.fecha);
  var el = document.createElement("div");
  el.className = "turno";
  el.innerHTML =
    '<div class="t-hora"></div><div><div class="t-nom"></div><div class="t-meta"></div><div class="t-meta t-fec"></div></div>' +
    '<div class="t-acc"><a class="mini" target="_blank" rel="noopener">WhatsApp</a>' +
    '<a class="mini" target="_blank" rel="noopener">Calendario</a>' +
    '<button class="mini borrar">Cancelar turno</button></div>';
  el.querySelector(".t-hora").textContent = t.hora;
  el.querySelector(".t-nom").textContent = t.nombre;
  el.querySelector(".t-meta").textContent = t.servicio + " · " + dur(Number(t.dur)) + (t.precio ? " · " + t.precio : "");
  el.querySelector(".t-fec").textContent = conFecha
    ? SEML[d.getDay()] + " " + d.getDate() + " de " + MES[d.getMonth()] + " · " + t.tel : t.tel;
  var links = el.querySelectorAll(".mini");
  links[0].href = "https://wa.me/" + String(t.tel).replace(/\D/g,"");
  links[1].href = enlaceGoogle(t);
  el.querySelector(".borrar").addEventListener("click", async function(){
    await pedirCancelar(t.id, t.fecha);
    pintarPanel();
  });
  return el;
}

async function pintarPanel(){
  var c = $("panel-cuerpo");
  c.innerHTML = '<div class="dias" id="dias-panel"></div><div id="lista-panel" style="margin-top:16px"></div>';
  tiraDias($("dias-panel"), panelFecha, function(iso){ panelFecha = iso; pintarPanel(); });
  var lista = await traerTurnos(panelFecha);
  var box = $("lista-panel");
  box.innerHTML = "";
  if(!lista.length){ box.innerHTML = '<div class="vacio">Sin turnos este día.</div>'; return; }
  lista.sort(function(a,b){ return aMin(a.hora) - aMin(b.hora); });
  lista.forEach(function(t){ box.appendChild(tarjeta(t, false)); });
}

/* ---------- arranque ---------- */
$("ir-panel").addEventListener("click", function(){
  $("vista-clienta").hidden = true; $("vista-panel").hidden = false;
  window.scrollTo({ top:0 });
  panelAbierto ? pintarPanel() : pedirPin();
});
$("salir-panel").addEventListener("click", function(){
  $("vista-panel").hidden = true; $("vista-clienta").hidden = false;
  if(sel.fecha && sel.servicio) cargarDia();
  window.scrollTo({ top:0 });
});
$("confirmar").addEventListener("click", confirmar);

document.title = "Turnos — " + CONFIG.salon;
$("marca").textContent = CONFIG.salon;
if(!API){
  $("banner").innerHTML =
    '<div class="banner"><strong>Modo demo.</strong> Falta conectar el backend: los turnos no se guardan ' +
    'y no se bloquean para las demás. Pegá la URL de tu Apps Script en la variable <code>API</code>.</div>';
}
pintarServicios();

})();
</script>
